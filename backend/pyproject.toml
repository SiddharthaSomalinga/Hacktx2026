[project]
name = "ghost-seats-backend"
version = "0.1.0"
description = "Ghost Seats backend: seat-state engine, study matching, push notifications"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "httpx>=0.27,<1",
    "itsdangerous>=2.2,<3",
    "pywebpush>=2.0,<3",
    "segno>=1.6,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "httpx2>=2.16.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error", "ignore::DeprecationWarning:pywebpush.*", "ignore::DeprecationWarning:py_vapid.*"]
markers = ["db: needs TEST_DATABASE_URL (a disposable Postgres + Timescale database)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pywebpush.*", "py_vapid.*", "segno.*"]
ignore_missing_imports = true
