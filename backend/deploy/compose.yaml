# One API container per Vultr instance (D36). Secrets come from ENV_FILE on the server, never
# from the repository. deploy.sh sets COMPOSE_PROJECT_NAME, GIT_SHA and FRONTEND_DIR.
services:
  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        FRONTEND_DIR: ${FRONTEND_DIR:-frontend}
    image: ghostseats-api:${GIT_SHA:-local}
    env_file: ${ENV_FILE:-/etc/ghostseats.env}
    ports:
      # Localhost only: Caddy on the host is the one client. Docker publishes ports through its
      # own iptables chain, so ufw alone does not keep a 0.0.0.0 binding off the internet.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    # Above uvicorn's 6 s graceful shutdown, so live streams are closed before SIGKILL (D61).
    stop_grace_period: 15s
    ulimits:
      nofile: 65536  # one socket per open live stream, behind Caddy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
