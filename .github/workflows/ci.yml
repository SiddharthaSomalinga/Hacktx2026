name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # Same image as `make db-up`: Postgres 16 + TimescaleDB with Toolkit.
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_PASSWORD: ghostseats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ghostseats@localhost:5432/ghostseats_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.11"
      - run: make sync
      - run: make lint
      - run: make typecheck
      - name: Create the test database
        run: psql postgresql://postgres:ghostseats@localhost:5432/postgres -c "CREATE DATABASE ghostseats_test"
      - run: make test-db

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.11"
      - run: uv run --no-project --python 3.12 --with-requirements requirements.txt --with pytest python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Builds the deploy image through compose.yaml, starts the whole stack, and drives it with a
  # browser: seeker request -> host accept -> location revealed (frontend/e2e).
  e2e:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: compose.yaml:compose.e2e.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: A throwaway node key for this run
        run: |
          key=$(openssl rand -hex 24)
          echo "::add-mask::$key"
          echo "NODE_KEY=$key" >> "$GITHUB_ENV"
      - name: Start the stack
        run: |
          docker compose up -d --build
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:8000/api/health && exit 0
            sleep 2
          done
          exit 1
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - name: Stack logs
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
